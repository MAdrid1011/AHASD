name: AHASD CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Validate hardware costs
      run: |
        python3 scripts/validate_hardware_costs.py
    
    - name: Check AHASD modules
      run: |
        test -f ONNXim/src/AHASDIntegration.h || exit 1
        test -f ONNXim/src/async_queue/EDC.h || exit 1
        test -f ONNXim/src/async_queue/TVC.h || exit 1
        test -f PIMSimulator/src/AAU.h || exit 1
        test -f PIMSimulator/src/GatedTaskScheduler.h || exit 1
        echo "✓ All AHASD modules present"
    
    - name: Compile reproduction scripts
      run: |
        python3 -m py_compile \
          scripts/reproduce_paper_data.py \
          scripts/run_etcc_trace_replay.py \
          scripts/run_baseline.py \
          scripts/gen_acceptance_trace.py \
          scripts/hardware_cost_model.py \
          scripts/validate_hardware_costs.py

    - name: Run fast replay reproduction
      run: |
        python3 scripts/reproduce_paper_data.py \
          --execution-mode fast-replay \
          --output-dir /tmp/ahasd-ci-repro \
          --timeout-s 900

    - name: Validate reproduced outputs
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path

        root = Path("/tmp/ahasd-ci-repro")
        manifest = json.load(open(root / "manifest.json"))
        expected = json.load(open("reproducibility/expected_outputs.json"))["outputs"]
        expected_names = {row["name"] for row in expected}
        actual_names = {path.name for path in (root / "csv").glob("*.csv")}
        missing = sorted(expected_names - actual_names)
        extra = sorted(actual_names - expected_names)

        assert manifest["ok_cells"] == manifest["cell_count"] == 108, manifest
        assert manifest.get("blocked_metrics", []) == [], manifest.get("blocked_metrics", [])
        assert missing == [], missing
        assert extra == [], extra
        assert len(list((root / "csv").glob("sensitivity_*.csv"))) == 16
        print("✓ fast replay reproduced 108/108 cells and all expected CSV outputs")
        PY

  documentation:
    name: Check Documentation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Verify documentation files
      run: |
        for doc in QuickStart Installation HardwareComponents Experiments FAQ; do
          test -f "docs/${doc}.md" || exit 1
        done
        echo "✓ All documentation files present"
